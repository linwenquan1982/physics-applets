<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Wavefront Power - Clean Layout</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #annotation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        #ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 15, 30, 0.9);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #444;
            width: 290px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        h2 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #555; padding-bottom: 8px; margin-bottom: 12px;}
        .control-group { margin: 16px 0 12px 0; }
        label { display: block; margin-bottom: 4px; font-weight: bold; color: #8ab4f8; font-size: 0.9rem; }
        input[type=range] { width: 100%; cursor: pointer; margin-top: 6px;}
        
        .btn-container { display: flex; gap: 8px; margin-bottom: 12px; }
        button {
            flex: 1;
            padding: 8px;
            background: #2a2a4a;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        button:hover { background: #3a3a6a; }
        button:active { background: #5a5a8a; }
        .active-btn { background: #4CAF50 !important; border-color: #81c784 !important; }

        .floating-card {
            position: absolute;
            background: rgba(10, 10, 25, 0.95);
            border: 1px solid #555;
            padding: 12px;
            border-radius: 8px;
            width: max-content;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            font-size: 0.85rem;
            pointer-events: none; 
            z-index: 5;
            display: none;
            line-height: 1.4;
        }
        .wave-card { border-top: 4px solid #4CAF50; }
        .patch-card { border-top: 4px solid #ff9800; }
        
        .card-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; }
        .wave-card .card-title { color: #4CAF50; }
        .patch-card .card-title { color: #ff9800; }
        
        .card-desc { font-size: 0.8rem; color: #ccc; margin-bottom: 8px; }
        .math-item { margin: 6px 0; }

        /* Relocated and styled banner option at bottom of panel */
        #pause-msg {
            color: #ffca28;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border: 1px dashed #555;
            border-radius: 6px;
            background: rgba(25, 25, 50, 0.4);
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s, border-color 0.2s;
        }
        #pause-msg:hover {
            background: rgba(45, 45, 90, 0.6);
            border-color: #777;
        }
        .small-note { font-size: 0.75rem; color: #aaa; font-weight: normal; margin-top: 2px; display: block; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>Spherical Wavefront Power</h2>
        
        <div class="btn-container">
            <button id="btn-emit">Emit Pulse<br><span class="small-note">(Hold for stream)</span></button>
            <button id="btn-toggle">Continuous:<br>OFF</button>
        </div>

        <div class="control-group">
            <label style="color: #ffffff; font-weight: normal;">Source Power (P): <b>1000 W</b></label>
        </div>

        <div class="control-group">
            <label for="areaSlider">Detector Patch Area: <span id="detector-area-val">10.0</span> m&sup2;</label>
            <input type="range" id="areaSlider" min="1.0" max="15.0" value="10.0" step="0.5">
        </div>

        <div id="pause-msg">[ RUNNING ]<br><span class="small-note" style="color:#bbb;">Click here or Press Spacebar to Pause</span></div>
    </div>

    <div id="wave-card" class="floating-card wave-card">
        <div class="card-title">Spherical Wavefront</div>
        <div class="card-desc">All energy of the single pulse is confined within the growing spherical surface area.</div>
        <div class="math-item" id="lat-wave-r"></div>
        <div class="math-item" id="lat-wave-a"></div>
        <div class="math-item" id="lat-wave-i"></div>
    </div>

    <div id="patch-card" class="floating-card patch-card">
        <div class="card-title">Selected Curved Patch</div>
        <div class="math-item" id="lat-patch-a"></div>
        <div class="math-item" id="lat-patch-p"></div>
    </div>

    <canvas id="annotation-canvas"></canvas>
    <div id="canvas-container"></div>

    <script>
        // --- 1. Scene Base Structure Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(22, 16, 28);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const labelCanvas = document.getElementById('annotation-canvas');
        const ctx = labelCanvas.getContext('2d');
        function resizeLabelCanvas() {
            labelCanvas.width = window.innerWidth;
            labelCanvas.height = window.innerHeight;
        }
        resizeLabelCanvas();

        const gridHelper = new THREE.GridHelper(60, 60, 0x222233, 0x131320);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        const sourceGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const sourceMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const sourceMesh = new THREE.Mesh(sourceGeo, sourceMat);
        scene.add(sourceMesh);

        // --- 2. Variable Fields ---
        const POWER = 1000;
        const WAVE_SPEED = 6; 
        const MAX_RADIUS = 25; 
        const EMIT_INTERVAL = 0.2; 

        let isPaused = false;
        let isHoldingEmit = false;
        let isContinuous = false;
        let timeSinceLastEmit = 0;
        let pulses = []; 

        const clock = new THREE.Clock();
        const waveGeoTemplate = new THREE.SphereGeometry(1, 32, 24);
        const colorHot = new THREE.Color(0xffea00); 
        const colorCold = new THREE.Color(0x0055ff); 

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedPatchMesh = null;
        let lastHitPoint = null; 
        let lastHitPulse = null;

        const btnEmit = document.getElementById('btn-emit');
        const btnToggle = document.getElementById('btn-toggle');
        const pauseMsg = document.getElementById('pause-msg');
        const areaSlider = document.getElementById('areaSlider');
        const detAreaUI = document.getElementById('detector-area-val');
        
        const waveCardEl = document.getElementById('wave-card');
        const patchCardEl = document.getElementById('patch-card');

        // --- 3. Event Control Bindings ---
        btnEmit.addEventListener('mousedown', () => { isHoldingEmit = true; emitPulse(); });
        btnEmit.addEventListener('mouseup', () => { isHoldingEmit = false; });
        btnEmit.addEventListener('mouseleave', () => { isHoldingEmit = false; });
        btnEmit.addEventListener('touchstart', (e) => { e.preventDefault(); isHoldingEmit = true; emitPulse(); });
        btnEmit.addEventListener('touchend', () => { isHoldingEmit = false; });

        btnToggle.addEventListener('click', () => {
            isContinuous = !isContinuous;
            btnToggle.classList.toggle('active-btn');
            btnToggle.innerHTML = isContinuous ? "Continuous:<br>ON" : "Continuous:<br>OFF";
        });

        function toggleSimulationPause() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseMsg.innerHTML = "[ PAUSED ]<br><span class='small-note' style='color:#ffcc80;'>Click on a wavefront shell to inspect a patch.</span>";
                pauseMsg.style.color = "#ff9800";
                pauseMsg.style.background = "rgba(45, 25, 10, 0.5)";
                pauseMsg.style.borderColor = "#ff9800";
            } else {
                pauseMsg.innerHTML = "[ RUNNING ]<br><span class='small-note' style='color:#bbb;'>Click here or Press Spacebar to Pause</span>";
                pauseMsg.style.color = "#ffca28";
                pauseMsg.style.background = "rgba(25, 25, 50, 0.4)";
                pauseMsg.style.borderColor = "#555";
                resetPatchState();
            }
        }

        pauseMsg.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSimulationPause();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleSimulationPause();
            }
        });

        areaSlider.addEventListener('input', () => {
            detAreaUI.innerText = parseFloat(areaSlider.value).toFixed(1);
            if (isPaused && lastHitPoint && lastHitPulse) {
                generateCurvedAreaPatch(lastHitPulse.radius, lastHitPoint);
            }
        });

        window.addEventListener('click', (e) => {
            if (!isPaused) return; 
            if (e.target.closest('#ui-panel') || e.target.closest('.floating-card')) return; 

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const waveMeshes = pulses.map(p => p.mesh);
            const intersects = raycaster.intersectObjects(waveMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const matchedPulse = pulses.find(p => p.mesh === hit.object);
                if (matchedPulse) {
                    lastHitPoint = hit.point.clone();
                    lastHitPulse = matchedPulse;
                    generateCurvedAreaPatch(matchedPulse.radius, hit.point);
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeLabelCanvas();
        });

        // --- 4. Emission Processing ---
        function emitPulse() {
            if (isPaused) return;

            const mat = new THREE.MeshBasicMaterial({ 
                color: colorHot.clone(), 
                wireframe: true, 
                transparent: true, 
                opacity: 1.0,
                blending: THREE.AdditiveBlending 
            });

            const mesh = new THREE.Mesh(waveGeoTemplate, mat);
            mesh.scale.set(0.1, 0.1, 0.1);
            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;

            scene.add(mesh);
            pulses.push({ radius: 0.1, mesh: mesh, material: mat });
            timeSinceLastEmit = 0;
        }

        // --- 5. Curved Patch Construction Mapping ---
        function generateCurvedAreaPatch(radius, hitPoint) {
            if (selectedPatchMesh) {
                scene.remove(selectedPatchMesh);
                selectedPatchMesh.geometry.dispose();
                selectedPatchMesh.material.dispose();
                selectedPatchMesh = null;
            }

            const currentDetArea = parseFloat(areaSlider.value);
            const L = Math.sqrt(currentDetArea);
            const patchGeo = new THREE.PlaneGeometry(L, L, 24, 24); 
            
            const tempMesh = new THREE.Mesh(patchGeo);
            tempMesh.position.copy(hitPoint);
            
            const surfaceNormal = hitPoint.clone().normalize();
            tempMesh.lookAt(hitPoint.clone().add(surfaceNormal));
            tempMesh.updateMatrixWorld();

            const posAttribute = patchGeo.attributes.position;
            const vertex = new THREE.Vector3();
            const worldVertex = new THREE.Vector3();

            for (let i = 0; i < posAttribute.count; i++) {
                vertex.fromBufferAttribute(posAttribute, i);
                worldVertex.copy(vertex).applyMatrix4(tempMesh.matrixWorld);
                worldVertex.normalize().multiplyScalar(radius);
                tempMesh.worldToLocal(worldVertex);
                posAttribute.setXYZ(i, worldVertex.x, worldVertex.y, worldVertex.z);
            }
            posAttribute.needsUpdate = true;

            const patchMat = new THREE.MeshBasicMaterial({ 
                color: 0xff9800, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.75,
                depthTest: true
            });
            
            selectedPatchMesh = new THREE.Mesh(patchGeo, patchMat);
            selectedPatchMesh.position.copy(tempMesh.position);
            selectedPatchMesh.rotation.copy(tempMesh.rotation);
            scene.add(selectedPatchMesh);
        }

        function resetPatchState() {
            if (selectedPatchMesh) {
                scene.remove(selectedPatchMesh);
                selectedPatchMesh.geometry.dispose();
                selectedPatchMesh.material.dispose();
                selectedPatchMesh = null;
            }
            lastHitPoint = null;
            lastHitPulse = null;
            patchCardEl.style.display = 'none';
        }

        function getScreenCoords(vector3D) {
            const wp = vector3D.clone().project(camera);
            return {
                x: (wp.x * .5 + .5) * window.innerWidth,
                y: (-(wp.y * .5) + .5) * window.innerHeight
            };
        }

        // --- 6. Frame Animation Engine Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();

            ctx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);

            if (!isPaused) {
                timeSinceLastEmit += deltaTime;
                if ((isHoldingEmit || isContinuous) && timeSinceLastEmit >= EMIT_INTERVAL) {
                    emitPulse();
                }

                for (let i = pulses.length - 1; i >= 0; i--) {
                    let pulse = pulses[i];
                    pulse.radius += WAVE_SPEED * deltaTime;
                    pulse.mesh.scale.set(pulse.radius, pulse.radius, pulse.radius);

                    const lifeRatio = pulse.radius / MAX_RADIUS; 
                    pulse.material.opacity = Math.max(0, 1.0 - lifeRatio);
                    
                    const colorDecayRatio = Math.pow(1.0 - lifeRatio, 3.0); 
                    pulse.material.color.copy(colorCold).lerp(colorHot, colorDecayRatio);

                    if (pulse.radius > MAX_RADIUS) {
                        scene.remove(pulse.mesh);
                        pulse.material.dispose();
                        pulses.splice(i, 1);
                    }
                }
            }

            // --- 7. Vector To Screen Coordinate Projector ---
            // A. Base Sphere Output Label Card
            if (pulses.length > 0) {
                const referencePulse = isPaused && lastHitPulse ? lastHitPulse : pulses[0]; 
                const r = referencePulse.radius;
                
                const anchorDir = new THREE.Vector3(1, 0.7, -0.3).normalize();
                const waveContact3D = anchorDir.clone().multiplyScalar(r);
                const screenContact = getScreenCoords(waveContact3D);

                const waveLabelX = Math.min(screenContact.x + 60, window.innerWidth - 320);
                const waveLabelY = Math.max(screenContact.y - 100, 20);
                waveCardEl.style.left = `${waveLabelX}px`;
                waveCardEl.style.top = `${waveLabelY}px`; 
                waveCardEl.style.display = 'block';

                const area = 4 * Math.PI * r * r;
                const intensity = POWER / area;

                katex.render(`\\mathbf{\\text{Radius } (r) = ${r.toFixed(2)}\\text{ m}}`, document.getElementById('lat-wave-r'));
                katex.render(`\\text{Surface Area } (A) = 4\\pi r^2 = ${area.toFixed(1)}\\text{ m}^2`, document.getElementById('lat-wave-a'));
                katex.render(`\\text{Intensity } (I) = \\frac{P}{A} = ${intensity.toFixed(4)}\\text{ W/m}^2`, document.getElementById('lat-wave-i'));

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(76, 175, 80, 0.6)'; 
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]); 
                ctx.moveTo(screenContact.x, screenContact.y);
                ctx.lineTo(waveLabelX, waveLabelY + 30);
                ctx.stroke();
                ctx.setLineDash([]); 

                ctx.beginPath();
                ctx.fillStyle = '#4CAF50';
                ctx.arc(screenContact.x, screenContact.y, 4, 0, 2 * Math.PI);
                ctx.fill();
            } else {
                waveCardEl.style.display = 'none';
            }

            // B. Targeted Area Detector Patch Info Card
            if (isPaused && selectedPatchMesh && lastHitPoint && lastHitPulse) {
                const currentDetArea = parseFloat(areaSlider.value);
                const patchRadius = lastHitPulse.radius;
                const screenPatchContact = getScreenCoords(lastHitPoint);
                
                let lineTargetX;
                if (screenPatchContact.x < window.innerWidth * 0.5) {
                    patchCardEl.style.left = "";
                    patchCardEl.style.right = `${Math.max(20, window.innerWidth - screenPatchContact.x + 60)}px`;
                    patchCardEl.style.top = `${Math.max(20, screenPatchContact.y - 40)}px`;
                    lineTargetX = window.innerWidth - parseFloat(patchCardEl.style.right);
                } else {
                    patchCardEl.style.right = "";
                    patchCardEl.style.left = `${Math.max(20, screenPatchContact.x + 60)}px`;
                    patchCardEl.style.top = `${Math.max(20, screenPatchContact.y - 40)}px`;
                    lineTargetX = parseFloat(patchCardEl.style.left);
                }
                patchCardEl.style.display = 'block';

                const totalArea = 4 * Math.PI * patchRadius * patchRadius;
                const intensityAtPatch = POWER / totalArea;
                const powerIntercepted = intensityAtPatch * currentDetArea;

                katex.render(`\\mathbf{\\text{Detector Area } (A_{\\text{det}}) = ${currentDetArea.toFixed(1)}\\text{ m}^2}`, document.getElementById('lat-patch-a'));
                katex.render(`\\text{Power Received} = I \\times A_{\\text{det}} = ${powerIntercepted.toFixed(2)}\\text{ W}`, document.getElementById('lat-patch-p'));

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 152, 0, 0.7)'; 
                ctx.lineWidth = 1.5;
                ctx.moveTo(screenPatchContact.x, screenPatchContact.y);
                ctx.lineTo(lineTargetX, screenPatchContact.y);
                ctx.stroke();

                ctx.beginPath();
                ctx.fillStyle = '#ff9800';
                ctx.arc(screenPatchContact.x, screenPatchContact.y, 4, 0, 2 * Math.PI);
                ctx.fill();
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
